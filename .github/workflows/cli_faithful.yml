name: CLI faithful generation (CPU)
on:
  pull_request:
    paths:
      - 'cli/**'
      - 'voice_kit/**'
      - 'audio_mix/**'
      - 'Koebuta_Scenario_Inspector_v3.html'
      - '.github/workflows/cli_faithful.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest -v test_faithful test_irodori_generate test_cli_terminal test_ruby_bridge test_v3_scenario
        working-directory: cli
      - run: python -m unittest -v test_voice_kit
        working-directory: voice_kit
      - run: python -m unittest -v test_audio_mix
        working-directory: audio_mix
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node test_inspector_emoji.cjs
